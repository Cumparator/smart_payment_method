services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: spm
      POSTGRES_PASSWORD: spm
      POSTGRES_DB: spm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spm -d spm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: